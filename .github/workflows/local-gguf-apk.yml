name: Build local APK
on: { workflow_dispatch: {} }
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with: {submodules: recursive}
    - uses: actions/setup-java@v4
      with: {distribution: temurin, java-version: '21'}
    - uses: android-actions/setup-android@v3
      with: {packages: 'platforms;android-36 build-tools;35.0.0 cmake;3.22.1 ndk;27.2.12479018'}
    - run: |
        git clone --depth 1 https://github.com/ggml-org/llama.cpp.git android/deps/llama.cpp
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
        bash scripts/android/build-natives.sh
        cd android/src/android
        ./gradlew :app:assembleDebug --no-daemon
    - uses: actions/upload-artifact@v4
      with: {name: nanoMuse-local-apk, path: android/src/android/app/build/outputs/apk/debug/app-debug.apk}
