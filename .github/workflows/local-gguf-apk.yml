name: Build local GGUF APK
on: { workflow_dispatch: {} }
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with: {submodules: recursive}
    - uses: actions/setup-java@v4
      with: {distribution: temurin, java-version: '21'}
    - uses: actions/setup-go@v5
      with: {go-version: '1.26'}
    - uses: android-actions/setup-android@v3
      with: {packages: 'platforms;android-36 build-tools;35.0.0 cmake;3.22.1 ndk;27.2.12479018'}
    - name: Apply local GGUF integration
      run: |
        cat .github/local-gguf-patch/*.b64 | base64 -d | gzip -d > /tmp/local.patch
        git apply /tmp/local.patch
        git clone --depth 1 https://github.com/ggml-org/llama.cpp.git android/deps/llama.cpp
        sed -i '/mparams.use_mmap = true;/d' android/src/android/app/src/main/cpp/local_llama.cpp
        sed -i 's/^    fun generate(/    internal fun generate(/' android/src/android/app/src/main/java/io/github/nanomuse/localai/LocalLlamaBridge.kt
        sed -i 's/import androidx.compose.material.icons.outlined.Image/import androidx.compose.material.icons.outlined.Image\nimport androidx.compose.material.icons.outlined.Memory/' android/src/android/app/src/main/java/io/github/nanomuse/ui/models/ModelsScreen.kt
        sed -i 's/SettingsScaffold(title = "Local models", onBack = onBack) {/SettingsScaffold(title = "Local models", onBack = onBack, scrollable = false) {/' android/src/android/app/src/main/java/io/github/nanomuse/localai/LocalModelsScreen.kt
        sed -i 's/import androidx.compose.foundation.layout.weight/import androidx.compose.foundation.layout.weight/' android/src/android/app/src/main/java/io/github/nanomuse/localai/LocalModelsScreen.kt
        cat > android/src/android/app/src/main/java/io/github/nanomuse/localai/MissingLocalModelProvider.kt <<'EOF'
        package io.github.nanomuse.localai
        import com.openminis.app.data.model.*
        import com.openminis.app.provider.LLMProvider
        import kotlinx.coroutines.flow.Flow
        import kotlinx.coroutines.flow.flow
        class MissingLocalModelProvider(override var model: LLMModel) : LLMProvider {
          override val name = "Local GGUF"
          private fun fail(): Nothing = throw LLMError.ProviderError("This local model file is not installed. Download or import it again in Settings → Models → Local models.")
          override suspend fun sendMessageClamped(m: List<LLMMessage>, s: String?, n: Int, t: Double?, i: List<LLMMessage.ImagePart>, u: List<AgentToolDefinition>, l: ThinkingLevel): LLMResponse = fail()
          override fun streamMessageClamped(m: List<LLMMessage>, s: String?, n: Int, t: Double?, i: List<LLMMessage.ImagePart>, u: List<AgentToolDefinition>, l: ThinkingLevel): Flow<LLMStreamChunk> = flow { fail() }
        }
        EOF
        python3 - <<'PY'
        p='android/src/android/app/src/main/java/com/openminis/app/provider/ProviderFactory.kt'
        s=open(p).read(); n='    fun create(instance: ProviderInstance, apiKey: String, model: LLMModel, context: Context? = null): LLMProvider {\n'
        x='''    fun create(instance: ProviderInstance, apiKey: String, model: LLMModel, context: Context? = null): LLMProvider {\n        if (instance.id == "nanomuse-local-gguf" && context != null) {\n            val file = io.github.nanomuse.localai.LocalProviderRegistry.modelPath(context, model.id)\n                ?: return io.github.nanomuse.localai.MissingLocalModelProvider(model)\n            if (!io.github.nanomuse.localai.LocalModelState.matches(file.absolutePath)) {\n                io.github.nanomuse.localai.LocalLlamaBridge.unload()\n                io.github.nanomuse.localai.LocalLlamaBridge.load(file.absolutePath)\n                io.github.nanomuse.localai.LocalModelState.path = file.absolutePath\n            }\n            return io.github.nanomuse.localai.LocalLlamaProvider(model)\n        }\n'''
        open(p,'w').write(s.replace(n,x))
        q='android/src/android/app/src/main/java/io/github/nanomuse/localai/LocalProviderRegistry.kt'
        s=open(q).read()
        old='''    fun modelPath(context: Context, modelId: String): File? =
        LocalModels.installed(context).firstOrNull { modelId(it) == modelId }
'''
        new='''    fun modelPath(context: Context, modelId: String): File? {
        val files = LocalModels.installed(context)
        return files.firstOrNull { file ->
            val bare = file.name.removeSuffix(".gguf").replace(Regex("[^A-Za-z0-9._-]"), "-").lowercase()
            modelId == "local-$bare" || modelId == bare || modelId == "local-${file.name.lowercase()}"
        } ?: files.singleOrNull()
    }
'''
        open(q,'w').write(s.replace(old,new))
        PY
    - name: Build
      run: |
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
        bash scripts/android/build-natives.sh
        cd android/src/android
        ./gradlew :app:assembleDebug --console=plain --no-daemon
    - uses: actions/upload-artifact@v4
      with: {name: nanoMuse-local-GGUF-fixed-apk, path: android/src/android/app/build/outputs/apk/debug/app-debug.apk}
